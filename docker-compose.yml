# =============================================================================
# Enterprise AI Knowledge Base -- local development stack
#
#   cp .env.example .env      # then fill in GEMINI_API_KEY and JWT_SECRET
#   docker compose up -d
#
# Kafka is behind a profile because the default ingestion mode does not need it:
#
#   docker compose --profile kafka up -d      # start Kafka too
#
# The frontend is deliberately not containerised. It is a development server that
# benefits from hot reload, so it is run directly with `npm run dev`.
# =============================================================================

services:

  postgres:
    # The pgvector image is plain PostgreSQL with the vector extension already
    # compiled in, which avoids an extension build step at first start.
    image: pgvector/pgvector:pg16
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    # Rate-limit counters and cached answers are both disposable, so persistence
    # is switched off deliberately rather than by omission.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # KRaft mode, so there is no separate ZooKeeper service to run.
    image: apache/kafka:3.9.0
    container_name: knowledge-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker, so nothing can be replicated beyond one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: knowledge-base-cluster-1
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # --- Database ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # --- Kafka (only used when INGESTION_MODE=KAFKA) ---
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094

      # --- Secrets, supplied from your local .env and never committed ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      # --- Models ---
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}

      # --- Behaviour ---
      INGESTION_MODE: ${INGESTION_MODE:-IN_PROCESS}
      ANSWER_CACHE_ENABLED: ${ANSWER_CACHE_ENABLED:-false}
      AUDIT_STORE_QUERY_TEXT: ${AUDIT_STORE_QUERY_TEXT:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Uploaded files survive a container rebuild.
      - document-storage:/app/storage

volumes:
  postgres-data:
  kafka-data:
  document-storage:
